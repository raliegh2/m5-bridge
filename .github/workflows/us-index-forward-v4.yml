name: Train US index forward v4 H4

on:
  push:
    branches:
      - us-index-forward-v4-h4-growth
    paths:
      - "mt5_ai_bridge/us_index_forward_v4.py"
      - "research/train_us_index_forward_v4.py"
      - "research/validate_us_index_decade_proxy.py"
      - "research/data/US500_H4.csv"
      - "research/data/US500_D1.csv"
      - "research/data/IVV_D1.csv"
      - "research/us_index_forward_v3_model.json"
      - "tests/test_us_index_forward_v4.py"
      - ".github/workflows/us-index-forward-v4.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-compare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-index-forward-v4-h4-growth
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest python-dotenv

      - name: Compile V4 and decade validator
        run: python -m py_compile mt5_ai_bridge/us_index_forward_v4.py research/train_us_index_forward_v4.py research/validate_us_index_decade_proxy.py

      - name: Run V4 tests
        run: python -m pytest -q tests/test_us_index_forward_v4.py

      - name: Train H4 V4 and compare on $5,000
        id: train
        shell: bash
        run: |
          set +e
          python research/train_us_index_forward_v4.py --balance 5000
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Run sealed 10-year IVV proxy
        id: decade
        shell: bash
        run: |
          set +e
          python research/validate_us_index_decade_proxy.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit reproducible V4 and decade reports
        shell: bash
        run: |
          test -f research/us_index_forward_v4_model.json
          test -f research/us_index_forward_v4_result.json
          test -f research/us_index_forward_v4_result_ledger.json
          test -f research/us_index_decade_proxy_result.json
          test -f research/us_index_decade_proxy_ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/us_index_forward_v4_model.json research/us_index_forward_v4_result.json research/us_index_forward_v4_result_ledger.json research/us_index_decade_proxy_result.json research/us_index_decade_proxy_ledger.json
          if git diff --cached --quiet; then
            echo "No generated V4/decade changes to commit."
          else
            git commit -m "Train V4 and validate 10y US index proxy [skip ci]"
            git push origin HEAD:us-index-forward-v4-h4-growth
          fi

      - name: Enforce decade return gate
        if: steps.decade.outputs.status != '0'
        run: |
          echo "The sealed IVV decade proxy did not clear >10% cumulative return."
          exit 1

      - name: Enforce V4 H4 growth gate
        if: steps.train.outputs.status != '0'
        run: |
          echo "V4 H4 did not clear the locked growth gate. Report remains research-only."
          exit 1
