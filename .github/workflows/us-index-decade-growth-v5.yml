name: Train US index decade growth v5

on:
  push:
    branches:
      - us-index-decade-growth-v5
    paths:
      - "mt5_ai_bridge/us_index_decade_growth_v5.py"
      - "research/train_us_index_decade_growth_v5.py"
      - "research/data/VTI_D1.csv"
      - "research/data/ONEQ_D1.csv"
      - "research/data/IWM_D1.csv"
      - ".github/workflows/us-index-decade-growth-v5.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decade-growth:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-index-decade-growth-v5
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy pandas

      - name: Compile V5
        run: python -m py_compile mt5_ai_bridge/us_index_decade_growth_v5.py research/train_us_index_decade_growth_v5.py

      - name: Train pre-2016 and run sealed decade test
        id: train
        shell: bash
        run: |
          set +e
          python research/train_us_index_decade_growth_v5.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit V5 model and decade report
        shell: bash
        run: |
          test -f research/us_index_decade_growth_v5_model.json
          test -f research/us_index_decade_growth_v5_result.json
          test -f research/us_index_decade_growth_v5_ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/us_index_decade_growth_v5_model.json research/us_index_decade_growth_v5_result.json research/us_index_decade_growth_v5_ledger.json
          if git diff --cached --quiet; then
            echo "No generated V5 changes to commit."
          else
            git commit -m "Train US index decade growth V5 [skip ci]"
            git push origin HEAD:us-index-decade-growth-v5
          fi

      - name: Enforce 10 percent CAGR decade gate
        if: steps.train.outputs.status != '0'
        run: |
          echo "V5 did not clear the locked 10% CAGR decade gate. Reports were committed for inspection."
          exit 1
