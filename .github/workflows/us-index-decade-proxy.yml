name: Validate US index decade proxy

on:
  push:
    branches:
      - us-index-forward-v4-h4-growth
    paths:
      - "research/validate_us_index_decade_proxy.py"
      - "research/data/IVV_D1.csv"
      - "mt5_ai_bridge/us_index_forward_v2.py"
      - "mt5_ai_bridge/us_index_forward_v3.py"
      - ".github/workflows/us-index-decade-proxy.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decade-proxy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-index-forward-v4-h4-growth
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy pandas python-dotenv

      - name: Compile decade proxy validator
        run: python -m py_compile research/validate_us_index_decade_proxy.py

      - name: Run sealed decade proxy
        id: validate
        shell: bash
        run: |
          set +e
          python research/validate_us_index_decade_proxy.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit decade proxy report
        shell: bash
        run: |
          test -f research/us_index_decade_proxy_result.json
          test -f research/us_index_decade_proxy_ledger.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/us_index_decade_proxy_result.json research/us_index_decade_proxy_ledger.json
          if git diff --cached --quiet; then
            echo "No decade proxy changes to commit."
          else
            git commit -m "Validate US index architecture on 10y IVV proxy [skip ci]"
            git push origin HEAD:us-index-forward-v4-h4-growth
          fi

      - name: Enforce greater-than-10-percent decade gate
        if: steps.validate.outputs.status != '0'
        run: |
          echo "Decade proxy did not clear >10% cumulative return. Report committed for inspection."
          exit 1
