name: Train US index forward v1

on:
  push:
    branches:
      - us-index-forward-v1
    paths:
      - "mt5_ai_bridge/us_index_forward_v1.py"
      - "us_index_forward_bot.py"
      - "research/train_us_index_forward_v1.py"
      - "research/us_index_forward_v1_locked.json"
      - "research/data/US500_D1.csv"
      - "tests/test_us_index_forward_v1.py"
      - ".github/workflows/us-index-forward-v1.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  train-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: us-index-forward-v1
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused dependencies
        run: python -m pip install --upgrade pip numpy pandas pytest python-dotenv

      - name: Compile model and runner
        run: >-
          python -m py_compile
          mt5_ai_bridge/us_index_forward_v1.py
          research/train_us_index_forward_v1.py
          us_index_forward_bot.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_us_index_forward_v1.py

      - name: Train frozen artifact and score post-cutoff history
        id: train
        shell: bash
        run: |
          set +e
          python research/train_us_index_forward_v1.py
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit reproducible artifact and result
        shell: bash
        run: |
          test -f research/us_index_forward_v1_model.json
          test -f research/us_index_forward_v1_result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f research/us_index_forward_v1_model.json research/us_index_forward_v1_result.json
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "Train US index forward model [skip ci]"
            git push origin HEAD:us-index-forward-v1
          fi

      - name: Enforce historical forward-test gate
        if: steps.train.outputs.status != '0'
        run: |
          echo "Historical gate failed; generated files were committed for inspection."
          exit 1
